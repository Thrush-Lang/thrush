[workspace]
members = [
    "thrustc",
    "thrustc_core",
    "thrustc_ast",
    "thrustc_builtins",
    "thrustc_compile_time",
    "thrustc_lexer",
    "thrustc_parser",
    "thrustc_parser_table",
    "thrustc_parser_context",
    "thrustc_parser_external_table", 
    "thrustc_typesystem", 
    "thrustc_code_location", 
    "thrustc_diagnostician", 
    "thrustc_errors", 
    "thrustc_errors_macros",
    "thrustc_logging",
    "thrustc_options",
    "thrustc_mir", 
    "thrustc_token", 
    "thrustc_attributes",
    "thrustc_attribute_checker",  
    "thrustc_typechecker", 
    "thrustc_scoper", 
    "thrustc_general_analyzer", 
    "thrustc_linter", 
    "thrustc_constants", 
    "thrustc_reader",  
    "thrustc_semantic_analysis", 
    "thrustc_entities", 
    "thrustc_preprocessor",
    "thrustc_llvm_abi",
    "thrustc_llvm_system_v_abi",
    "thrustc_llvm_webassembly_abi",
    "thrustc_llvm_codegen",
    "thrustc_llvm_codegen_variatic", 
    "thrustc_llvm_attributes", 
    "thrustc_llvm_call_conventions",
    "thrustc_llvm_target_triple",
    "thrustc_llvm_compiler_intrinsic_checker", 
    "thrustc_llvm_call_conventions_checker", 
    "thrustc_backends", 
    "thrustc_directive",
    "thrustc_ast_modificators", 
    "thrustc_token_type", 
    "thrustc_ast_verifier", 
    "thrustc_heap_allocator", 
    "thrustc_ast_external", 
    "thrustc_cli",
    "thrustc_llvm_abi_representation", 
    "thrustc_abi", 
    "thrustc_llvm_nvidia_cuda_abi", 
    "thrustc_llvm_linker_driver", 
    "thrustc_utils", 
    "thrustc_std", 
    "thrustc_generics",
]

exclude = [
    "fuzz"  
]

resolver = "2"

[workspace.package]
name = "thrustc"
description = "The compiler for Thrust Programming Language."
edition = "2024"
license = "GPL-3.0"
version = "0.2.2"
rust-version = "1.85.0"

authors = [
    "Stevens Benavides <foss.stevens.benavides@gmail.com>"
]

homepage = "https://github.com/thrustlang/thrustc"
repository = "https://github.com/thrustlang/thrustc"

[patch.crates-io]
clang-sys = { path = "crates/llvm/17/clang-sys" }
llvm-sys = { path = "crates/llvm/17/llvm-sys" }

[workspace.dependencies]
inkwell = { path = "crates/llvm/inkwell" }
clang = { path = "crates/llvm/clang" }

[profile.dev]
incremental = true

[profile.dev.package."*"]
incremental = true
opt-level = 2

[profile.release]
incremental = true
opt-level = 3
codegen-units = 1
lto = false
panic = "abort"
debug = true

[profile.release.package."*"]
incremental = true
opt-level = 'z'

[profile.release-stripped]
inherits = "release"
incremental = true
opt-level = "z"
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"
debug = false

[profile.release-stripped.package."*"]
incremental = true
opt-level = 'z'
strip = "symbols"
codegen-units = 1
debug = false
